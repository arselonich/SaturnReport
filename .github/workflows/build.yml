name: Build Windows EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas openpyxl pyinstaller
      - run: pyinstaller --onefile --noconsole --name SaturnReport saturn_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: SaturnReport-windows
          path: dist/SaturnReport.exe
